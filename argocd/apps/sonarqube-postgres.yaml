apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Microserviceset/Infra.git
    targetRevision: main
    path: platform/sonarqube
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
