apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskmanager-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Microserviceset/Infra.git
    targetRevision: main
    path: helm/taskmanager
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true      # delete resources removed from git
      selfHeal: true   # undo manual changes made in the cluster
